services:
  backend:
    build: ./backend
    container_name: house-price-backend
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_ORIGINS=http://localhost:5173
    volumes:
      - ./backend/models:/app/models

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: house-price-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend